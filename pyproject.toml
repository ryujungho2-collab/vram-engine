[project]
name = "vram-engine"
version = "0.1.0"
description = "VRAM Autonomous Intelligence Engine (hybrid BM25+spectral retrieval, agent, safety)"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.13.0",
    "matplotlib>=3.5",
    "networkx>=3.0",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["vram_engine/tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
