[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vram-engine"
version = "0.1.0"
description = "Graph-based retrieval and verification engine"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "matplotlib",
    "networkx",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["vram_engine/tests"]

[tool.setuptools.packages.find]
include = ["vram_engine*"]
